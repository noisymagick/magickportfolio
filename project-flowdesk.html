<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowdesk — Alexander Saloidov</title>
    <link rel="stylesheet" href="style.css">
    <!-- Скрипт для корректной загрузки языка -->
    <script>
        (function() {
            var lang = localStorage.getItem('lang') || 'ru';
            var style = document.createElement('style');
            style.textContent = 'body:not(.lang-loaded) { visibility: hidden; }';
            document.head.appendChild(style);
            window.addEventListener('DOMContentLoaded', function() {
                var buttons = document.querySelectorAll('.lang-btn');
                buttons.forEach(function(btn) {
                    btn.classList.remove('active');
                    if (btn.dataset.lang === lang) {
                        btn.classList.add('active');
                    }
                });
            });
        })();
    </script>
</head>

        <div class="lang-switch">

            <button class="lang-btn active" data-lang="ru">

</header>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lukum — Alexander Saloidov</title>
    <link rel="stylesheet" href="../../style.css">
    <script>
        (function() {
            var lang = localStorage.getItem('lang') || 'ru';
            var style = document.createElement('style');
            style.textContent = 'body:not(.lang-loaded) { visibility: hidden; }';
            document.head.appendChild(style);
            window.addEventListener('DOMContentLoaded', function() {
                var buttons = document.querySelectorAll('.lang-btn');
                buttons.forEach(function(btn) {
                    btn.classList.remove('active');
                    if (btn.dataset.lang === lang) {
                        btn.classList.add('active');
                    }
                });
            });
        })();
    </script>
</head>
<body>
<canvas class="grain"></canvas>

<header class="header">
    <nav class="nav">
        <div class="nav-left">
            <div class="nav-indicator"></div>
            <a href="/#home" data-i18n="nav.home"></a>
            <a href="/#projects" data-i18n="nav.projects" class="active"></a>
            <a href="/#archive" data-i18n="nav.archive"></a>
        </div>
        <div class="lang-switch">
            <button class="lang-btn active" data-lang="ru">Ru</button>
            <span>/</span>
            <button class="lang-btn" data-lang="en">Eng</button>
        </div>
    </nav>
</header>

<main class="project-content-wrapper">
    <div class="project-info">
        <a href="/#projects" class="back-link" data-i18n="general.back"></a>
        <h1 data-i18n="projects.lukum.title"></h1>
        
        <div class="project-meta">
            <p class="meta-label" data-i18n="projects.lukum.service_label"></p>
            <p class="meta-value" data-i18n="projects.lukum.service"></p>
            <p class="meta-label" data-i18n="projects.lukum.year_label"></p>
            <p class="meta-value" data-i18n="projects.lukum.year"></p>
        </div>

        <div class="project-description">
            <p class="meta-value" data-i18n="projects.lukum.description"></p>
            <a href="https://www.behance.net/gallery/199925387/LUKUM-identity-and-packaging-design" 
               target="_blank" 
               class="behance-link"
               data-i18n="general.behance"></a>
        </div>
    </div>
    
    <div class="project-content">
        <img src="img/00.jpg" alt="Lukum">
        <img src="img/1.jpg" alt="Lukum">
        <img src="img/2.jpg" alt="Lukum">
        <img src="img/3.jpg" alt="Lukum">
        <img src="img/4.jpg" alt="Lukum">
        <img src="img/5.jpg" alt="Lukum">
        <img src="img/6.jpg" alt="Lukum">
        <img src="img/7.jpg" alt="Lukum">
        <img src="img/8.jpg" alt="Lukum">
        <img src="img/9.jpg" alt="Lukum">
        <img src="img/10.jpg" alt="Lukum">
        <img src="img/11.jpg" alt="Lukum">
        <img src="img/12.jpg" alt="Lukum">
        <img src="img/13.jpg" alt="Lukum">
        <img src="img/14.jpg" alt="Lukum">
        <img src="img/15.jpg" alt="Lukum">
        <img src="img/16.jpg" alt="Lukum">
        <img src="img/17.jpg" alt="Lukum">
        <img src="img/18.jpg" alt="Lukum">
        <img src="img/19.jpg" alt="Lukum">
        <img src="img/20.jpg" alt="Lukum">
    </div>
</main>

<script src="../../script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alice AI — Alexander Saloidov</title>
    <link rel="stylesheet" href="../../style.css">
    <script>
        (function() {
            var lang = localStorage.getItem('lang') || 'ru';
            var style = document.createElement('style');
            style.textContent = 'body:not(.lang-loaded) { visibility: hidden; }';
            document.head.appendChild(style);
            window.addEventListener('DOMContentLoaded', function() {
                var buttons = document.querySelectorAll('.lang-btn');
                buttons.forEach(function(btn) {
                    btn.classList.remove('active');
                    if (btn.dataset.lang === lang) {
                        btn.classList.add('active');
                    }
                });
            });
        })();
    </script>
</head>
<body>
<canvas class="grain"></canvas>

<header class="header">

    <nav class="nav">

        <div class="nav-left">

            <div class="nav-indicator"></div>

            <a href="/#home" data-i18n="nav.home"></a>

            <a href="/#projects" data-i18n="nav.projects" class="active"></a>

            <a href="/#archive" data-i18n="nav.archive"></a>

        </div>

        <div class="lang-switch">

            <button class="lang-btn active" data-lang="ru">
                Ru
            </button>

            <span>/</span>

            <button class="lang-btn" data-lang="en">
                Eng
            </button>

        </div>

    </nav>

</header>

<main class="project-content-wrapper" data-status="nda">
    <div class="project-info">
        <a href="/#projects" class="back-link" data-i18n="general.back"></a>
        <h1 data-i18n="projects.aliceai.title"></h1>
        
        <div class="project-meta">
            <p class="meta-label" data-i18n="projects.aliceai.service_label"></p>
            <p class="meta-value" data-i18n="projects.aliceai.service"></p>
            <p class="meta-label" data-i18n="projects.aliceai.year_label"></p>
            <p class="meta-value" data-i18n="projects.aliceai.year"></p>
        </div>

        <div class="project-description">
            <p class="meta-label" data-i18n="projects.aliceai.context_label"></p>
            <p class="meta-value" data-i18n="projects.aliceai.context"></p>
            <p class="meta-label" data-i18n="projects.aliceai.task_label"></p>
            <p class="meta-value" data-i18n="projects.aliceai.task"></p>
            <p class="meta-label" data-i18n="projects.aliceai.action_label"></p>
            <p class="meta-value" data-i18n="projects.aliceai.action"></p>
            <p class="meta-label" data-i18n="projects.aliceai.result_label"></p>
            <p class="meta-value" data-i18n="projects.aliceai.result"></p>
        </div>
    </div>
    
    <div class="project-content">
        <img src="img/A01.png" alt="Alice AI">
        <img src="img/A02.png" alt="Alice AI">
        <img src="img/A03.png" alt="Alice AI">
        <img src="img/A04.png" alt="Alice AI">
    </div>
</main>

<script src="../../script.js"></script>
</body>
</html>

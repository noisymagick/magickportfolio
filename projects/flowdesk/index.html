<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowdesk — Alexander Saloidov</title>
    <link rel="stylesheet" href="../../style.css">
    <!-- Скрипт для корректной загрузки языка -->
    <script>
        (function() {
            var lang = localStorage.getItem('lang') || 'ru';
            var style = document.createElement('style');
            style.textContent = 'body:not(.lang-loaded) { visibility: hidden; }';
            document.head.appendChild(style);
            window.addEventListener('DOMContentLoaded', function() {
                var buttons = document.querySelectorAll('.lang-btn');
                buttons.forEach(function(btn) {
                    btn.classList.remove('active');
                    if (btn.dataset.lang === lang) {
                        btn.classList.add('active');
                    }
                });
            });
        })();
    </script>
</head>
<body>
<canvas class="grain"></canvas>

<header class="header">

    <nav class="nav">

        <div class="nav-left">

            <div class="nav-indicator"></div>

            <a href="/#home"
               data-ru="Главная"
               data-en="Home">
               Главная
            </a>

            <a href="/#projects"
               data-ru="Проекты"
               data-en="Projects"
               class="active">
               Проекты
            </a>

            <a href="/#archive"
               data-ru="Архив"
               data-en="Archive">
               Архив
            </a>

        </div>

        <div class="lang-switch">

            <button class="lang-btn active" data-lang="ru">
                Ru
            </button>

            <span>/</span>

            <button class="lang-btn" data-lang="en">
                Eng
            </button>

        </div>

    </nav>

</header>

<main class="project-content-wrapper">
    <!-- Блок с описанием проекта -->
    <div class="project-info">
        <a href="/#projects" class="back-link" data-ru="← Назад" data-en="← Back">← Назад</a>
        <h1 data-i18n="projects.flowdesk.title"></h1>
        
        <div class="project-meta">
            <p class="meta-label" data-i18n="projects.flowdesk.service_label"></p>
            <p class="meta-value" data-i18n="projects.flowdesk.service"></p>
            <p class="meta-label" data-i18n="projects.flowdesk.year_label"></p>
            <p class="meta-value" data-i18n="projects.flowdesk.year"></p>
        </div>

        <div class="project-description">
            <p class="meta-label" data-i18n="projects.flowdesk.context_label"></p>
            <p class="meta-value" data-i18n="projects.flowdesk.context"></p>
            <p class="meta-label" data-i18n="projects.flowdesk.idea_label"></p>
            <p class="meta-value" data-i18n="projects.flowdesk.idea"></p>
        </div>
    </div>
    
    <!-- Блок с изображениями проекта -->
    <div class="project-content">
        <img src="img/Concept_01.jpg" alt="Flowdesk">
        <img src="img/Concept_02.jpg" alt="Flowdesk">
        <img src="img/Concept_03.jpg" alt="Flowdesk">
        <img src="img/Concept_04.jpg" alt="Flowdesk">
        <img src="img/Concept_05.jpg" alt="Flowdesk">
        <img src="img/Concept_06.jpg" alt="Flowdesk">
        <img src="img/Concept_07.jpg" alt="Flowdesk">
        <img src="img/Concept_08.jpg" alt="Flowdesk">
        <img src="img/Concept_09.jpg" alt="Flowdesk">
        <img src="img/Concept_10.jpg" alt="Flowdesk">
        <img src="img/Concept_11.jpg" alt="Flowdesk">
        <img src="img/Concept_12.jpg" alt="Flowdesk">
        <img src="img/Concept_13.jpg" alt="Flowdesk">
        <img src="img/Concept_14.jpg" alt="Flowdesk">
        <img src="img/Concept_15.jpg" alt="Flowdesk">
        <img src="img/Concept_16.jpg" alt="Flowdesk">
        <img src="img/Concept_17.jpg" alt="Flowdesk">
        <img src="img/Concept_18.jpg" alt="Flowdesk">
    </div>
</main>

<script src="../../script.js"></script>
</body>
</html>
